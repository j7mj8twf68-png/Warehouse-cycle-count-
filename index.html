                })()}
              </>
            )}
          </div>
        )}

        {tab==="assign"&&(
          <div>
            <div style={PT}><span style={RB}/>Assign Lists</div>
            <div style={PS}>Choose a file and how many random uncounted parts to assign</div>
            {invFiles.length===0?(
              <div style={CARD}><div style={{ color:C.muted,marginBottom:12 }}>Upload an inventory file first.</div><button style={BT("out")} onClick={()=>setTab("upload")}>Import →</button></div>
            ):(
              <>
                <div style={CARD}>
                  {/* File picker */}
                  <div style={{ marginBottom:16 }}>
                    <label style={LBL}>Inventory File (source)</label>
                    <select style={INP(mob)} value={assignFileId} onChange={e=>setAssignFileId(e.target.value)}>
                      <option value="">-- select file --</option>
                      {invFiles.map(f=><option key={f.id} value={f.id}>{f.name} ({f.rows.length} items){!f.pnCol?" ⚠ needs setup":""}</option>)}
                    </select>
                    {(()=>{
                      const sf=invFiles.find(f=>f.id===assignFileId);
                      if(!sf) return null;
                      if(!sf.pnCol) return (
                        <div style={{ fontSize:11,color:C.warn,marginTop:6,fontWeight:700 }}>
                          ⚠ Column mapping not set —{" "}
                          <button style={{ color:C.warn,background:"none",border:"none",cursor:"pointer",fontWeight:700,fontSize:11,textDecoration:"underline",padding:0,fontFamily:FAM }}
                            onClick={()=>{setActiveFileId(sf.id);setTab("setup");}}>Set it up →</button>
                        </div>
                      );
                      const cyc    = fileCycles[sf.id] || { cycle:1, counted:[] };
                      const actPts = new Set(lists.filter(l=>!l.submitted).flatMap(l=>l.items.map(i=>i.partNum)));
                      const avail  = sf.rows.filter(r=>{ const pn=String(r[sf.pnCol]??"").trim(); return pn&&!new Set(cyc.counted).has(pn)&&!actPts.has(pn); }).length;
                      const cntd   = cyc.counted.length;
                      const inProg = sf.rows.filter(r=>actPts.has(String(r[sf.pnCol]??"").trim())).length;
                      const p      = pctOf(cntd, sf.rows.length);
                      return (
                        <>
                          <div style={{ display:"flex", gap:16, flexWrap:"wrap", fontSize:12, marginTop:8 }}>
                            <span style={{ color:C.ok, fontWeight:700 }}>✓ {avail} uncounted available</span>
                            {cntd>0&&<span style={{ color:C.muted }}>{cntd} counted this cycle</span>}
                            {inProg>0&&<span style={{ color:C.warn }}>{inProg} in active lists</span>}
                            <span style={{ color:C.warn, fontWeight:700 }}>Cycle {cyc.cycle}</span>
                          </div>
                          <div style={{ marginTop:8 }}>
                            <div style={{ display:"flex", justifyContent:"space-between", fontSize:10, color:C.muted, marginBottom:4 }}>
                              <span>Cycle {cyc.cycle} progress</span>
                              <span style={{ color:p>=100?C.ok:C.lt, fontWeight:700 }}>{p}% of {sf.rows.length} parts</span>
                            </div>
                            <div style={{ ...TRCK, height:5 }}><div style={FILL(p, p>=100?C.ok:C.red)}/></div>
                          </div>
                        </>
                      );
                    })()}
                  </div>

                  <div style={TC}>
                    <div>
                      <label style={LBL}>Assign To</label>
                      <select style={INP(mob)} value={assignTo} onChange={e=>setAssignTo(e.target.value)}>
                        <option value="">-- select worker --</option>
                        {workers.filter(w=>w.role==="worker").map(w=><option key={w.id} value={w.id}>{w.name}</option>)}
                      </select>
                    </div>
                    <div>
                      <label style={LBL}>Parts to Count</label>
                      <input
                        type="number"
                        inputMode="numeric"
                        min={1}
                        value={cSize}
                        style={{ ...INP(mob), fontSize:mob?26:22, fontWeight:900, textAlign:"center", color:C.wht, borderColor:C.red, minHeight:mob?60:52 }}
                        onChange={e=>setCSize(Math.max(1, parseInt(e.target.value)||1))}
                      />
                      <div style={{ display:"flex", gap:8, marginTop:10, flexWrap:"wrap" }}>
                        {[5,10,15,20,25,50,100].map(n=>(
                          <button key={n}
                            style={{ ...BT(cSize===n?"pri":"ghost"), fontSize:11, padding:"4px 12px", minHeight:32 }}
                            onClick={()=>setCSize(n)}>{n}</button>
                        ))}
                      </div>
                      <div style={{ fontSize:11, color:C.muted, marginTop:6 }}>
                        App picks randomly from uncounted parts only
                      </div>
                    </div>
                  </div>
                  <button style={{ ...BT("pri"), fontSize:mob?14:13, marginTop:4 }} onClick={assign}>
                    ▶ Assign {cSize} Random Parts
                  </button>
                </div>

                {lists.filter(l=>!l.submitted).map(list=>{
                  const c=list.items.filter(i=>i.status==="counted").length,sk=list.items.filter(i=>i.status==="skipped").length,p=pctOf(c+sk,list.items.length);
                  return (
                    <div key={list.id} style={{ ...FLAT,marginBottom:12 }}>
                      <div style={{ display:"flex",alignItems:"center",gap:14 }}>
                        <div style={{ position:"relative",flexShrink:0 }}>
                          <Ring pct={p} size={mob?50:60} sw={5}/>
                          <div style={{ position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:900,color:p===100?C.ok:C.red }}>{p}%</div>
                        </div>
                        <div style={{ flex:1,minWidth:0 }}>
                          <div style={{ display:"flex",alignItems:"center",gap:8,marginBottom:3,flexWrap:"wrap" }}>
                            <span style={{ fontSize:14,fontWeight:900,color:C.wht }}>{list.name}</span>
                            <Badge label="In Progress" color={C.warn}/>
                            {list.sourceFile&&<Badge label={list.sourceFile.replace(/\.[^.]+$/,"").slice(0,16)} color={C.muted}/>}
                          </div>
                          <div style={{ fontSize:11,color:C.muted,marginBottom:6 }}>→ <strong style={{ color:C.lt }}>{list.assignedName}</strong> · {list.items.length} parts · {list.createdAt}</div>
                          <div style={{ ...TRCK,marginBottom:4 }}><div style={FILL(p,p===100?C.ok:C.red)}/></div>
                          <div style={{ display:"flex",gap:12,fontSize:11 }}>
                            <span style={{ color:C.ok,fontWeight:700 }}>{c} counted</span>
                            <span style={{ color:C.warn,fontWeight:700 }}>{sk} skipped</span>
                            <span style={{ color:C.muted }}>{list.items.length-(c+sk)} left</span>
                          </div>
                        </div>
                        {!mob&&<button style={{ ...BT("out"),fontSize:11,padding:"5px 12px" }} onClick={()=>expList(list)}>↓ Export</button>}
                      </div>
                      {mob&&<button style={{ ...BT("out"),fontSize:12,width:"100%",marginTop:10 }} onClick={()=>expList(list)}>↓ Export</button>}
                    </div>
                  );
                })}
              </>
            )}
          </div>
        )}

        {tab==="workers"&&(
          <div>
            <div style={PT}><span style={RB}/>Workers</div>
            <div style={PS}>Manage worker accounts and PINs</div>
            <div style={CARD}>
              <div style={TC}>
                <div><label style={LBL}>Name</label><input style={INP(mob)} placeholder="Worker name" value={nwName} onChange={e=>setNwName(e.target.value)}/></div>
                <div><label style={LBL}>PIN (4–6 digits)</label><input style={INP(mob)} placeholder="e.g. 4729" type="text" inputMode="numeric" maxLength={6} value={nwPin} onChange={e=>setNwPin(e.target.value.replace(/\D/g,""))}/></div>
              </div>
              <button style={{ ...BT("pri"),fontSize:mob?14:12 }} onClick={addWorker}>+ Add Worker</button>
            </div>
            <div style={{ display:"grid",gap:10 }}>
              {workers.map(w=>{ const wL=lists.filter(l=>l.assignedTo===w.id&&!l.submitted).length; return (
                <div key={w.id} style={{ ...FLAT,marginBottom:0 }}>
                  <div style={{ display:"flex",alignItems:"center",gap:12 }}>
                    <Avtr name={w.name} bg={w.role==="admin"?C.redDk:C.mid} sz={mob?38:32}/>
                    <div style={{ flex:1,minWidth:0 }}>
                      <div style={{ fontSize:mob?16:14,fontWeight:900,color:C.wht }}>{w.name}</div>
                      <div style={{ display:"flex",gap:8,marginTop:3,alignItems:"center",flexWrap:"wrap" }}>
                        <Badge label={w.role} color={w.role==="admin"?C.red:C.muted}/>
                        <span style={{ fontSize:11,color:C.muted }}>{"●".repeat(w.pin.length)} PIN</span>
                        {wL>0&&<Badge label={`${wL} active`} color={C.warn}/>}
                      </div>
                    </div>
                    {w.id!=="admin"&&<button style={{ ...BT("ghost"),fontSize:mob?12:10,padding:mob?"8px 14px":"3px 10px",color:C.err }} onClick={()=>removeWorker(w.id)}>Remove</button>}
                  </div>
                </div>
              );})}
            </div>
          </div>
        )}

        {tab==="review"&&(()=>{
          // Submitted lists that haven't been marked completed yet
          const pendingReview = lists.filter(l=>l.submitted && !l.completed);

          // Update a single item's system (ERP) qty within a submitted list
          const setSysQty = (listId, itemId, val) => {
            setLists(prev=>prev.map(l=>{
              if(l.id!==listId) return l;
              const items = l.items.map(it=>{
                if(it.id!==itemId) return it;
                const sys = val===""?null:Number(val);
                const cnt = Number(it.countedQty);
                return {...it, systemQty:val, variance: sys!==null&&!isNaN(cnt) ? cnt-sys : null};
              });
              DB.updateItems(listId, items);
              return {...l, items};
            }));
          };

          const markCompleted = async (list) => {
            if(!window.confirm(`Mark "${list.name}" as completed? It will move to History.`)) return;
            const completedAt = nowStr();
            const completedList = {...list, completed:true, completedAt, completedBy:user.name};
            try {
              await DB.markCompleted(list.id, completedList.items, completedAt, user.name);
              await DB.insertHistory(completedList);
              setLists(prev=>prev.map(l=>l.id===list.id?completedList:l));
              setHistory(prev=>[completedList, ...prev.filter(h=>h.id!==list.id)]);
              showToast(`✓ ${list.name} completed & moved to History`);
            } catch(e){ console.error(e); showToast("Failed to complete","err"); }
          };

          return (
            <div>
              <div style={PT}><span style={RB}/>Submitted Counts</div>
              <div style={PS}>Review counts, enter what the ERP system shows, then mark completed</div>

              {pendingReview.length===0?(
                <div style={{ ...CARD,textAlign:"center",padding:"32px 20px" }}>
                  <div style={{ fontSize:40,marginBottom:12 }}>📭</div>
                  <div style={{ fontSize:16,fontWeight:700,color:C.wht,marginBottom:6 }}>No counts awaiting review</div>
                  <div style={{ fontSize:13,color:C.muted }}>When a worker submits a count list, it appears here for review.</div>
                </div>
              ):(
                <div style={{ display:"grid", gap:16 }}>
                  {pendingReview.map(list=>{
                    const counted = list.items.filter(i=>i.status==="counted");
                    const allEntered = counted.every(i=>i.systemQty!==undefined && i.systemQty!=="" && i.systemQty!==null);
                    const varianceCount = counted.filter(i=>i.variance!==null&&i.variance!==undefined&&i.variance!==0).length;
                    return (
                      <div key={list.id} style={{ ...FLAT, marginBottom:0 }}>
                        {/* List header */}
                        <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:14, flexWrap:"wrap" }}>
                          <Avtr name={list.assignedName} bg={C.red} sz={36}/>
                          <div style={{ flex:1, minWidth:0 }}>
                            <div style={{ fontSize:mob?16:18, fontWeight:900, color:C.wht }}>{list.name}</div>
                            <div style={{ fontSize:11, color:C.muted }}>
                              Submitted by <strong style={{ color:C.lt }}>{list.assignedName}</strong> · {list.submittedAt}
                            </div>
                          </div>
                          <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
                            <Badge label={`${counted.length} counted`} color={C.ok}/>
                            {varianceCount>0 && <Badge label={`${varianceCount} variance`} color={C.warn}/>}
                          </div>
                        </div>

                        {/* Parts table */}
                        <div style={{ overflowX:"auto", WebkitOverflowScrolling:"touch", marginBottom:14 }}>
                          <table style={{ width:"100%", borderCollapse:"collapse", fontSize:mob?12:13, minWidth:mob?480:"auto" }}>
                            <thead>
                              <tr>{["Part #","Location","Counted","System (ERP)","Variance"].map(h=>(
                                <th key={h} style={{ textAlign:"left",padding:"8px 10px",background:C.blk,color:C.muted,fontSize:9,fontWeight:900,letterSpacing:"0.1em",textTransform:"uppercase",borderBottom:`2px solid ${C.red}`,whiteSpace:"nowrap" }}>{h}</th>
                              ))}</tr>
                            </thead>
                            <tbody>
                              {counted.map(it=>{
                                const v = it.variance;
                                const vc = v===null||v===undefined?C.muted:v===0?C.ok:v>0?C.warn:C.err;
                                return (
                                  <tr key={it.id}>
                                    <td style={{ padding:"8px 10px",borderBottom:`1px solid ${C.mid}`,fontWeight:900,color:C.wht,whiteSpace:"nowrap" }}>{it.partNum}</td>
                                    <td style={{ padding:"8px 10px",borderBottom:`1px solid ${C.mid}`,color:C.warn }}>{it.location||"—"}</td>
                                    <td style={{ padding:"8px 10px",borderBottom:`1px solid ${C.mid}`,textAlign:"right",fontWeight:900,color:C.wht,fontSize:15 }}>{it.countedQty}</td>
                                    <td style={{ padding:"6px 10px",borderBottom:`1px solid ${C.mid}`,textAlign:"center" }}>
                                      <input type="number" inputMode="numeric" placeholder="—"
                                        value={it.systemQty??""}
                                        style={{ background:C.blk,border:`1px solid ${it.systemQty!==undefined&&it.systemQty!==""?vc:C.bdr}`,color:C.wht,borderRadius:4,padding:"6px 8px",fontSize:14,fontWeight:700,textAlign:"center",width:80,fontFamily:FAM }}
                                        onChange={e=>setSysQty(list.id, it.id, e.target.value)}/>
                                    </td>
                                    <td style={{ padding:"8px 10px",borderBottom:`1px solid ${C.mid}`,textAlign:"center" }}>
                                      {v===null||v===undefined
                                        ? <span style={{ color:C.muted }}>—</span>
                                        : v===0
                                          ? <Badge label="✓ Match" color={C.ok}/>
                                          : <span style={{ ...PILL(v) }}>{v>0?"+":""}{v}</span>}
                                    </td>
                                  </tr>
                                );
                              })}
                            </tbody>
                          </table>
                        </div>

                        {/* Action row */}
                        <div style={{ display:"flex", gap:10, alignItems:"center", flexWrap:"wrap" }}>
                          <button style={{ ...BT("pri"), fontSize:mob?14:13, opacity:allEntered?1:0.55 }}
                            onClick={()=>markCompleted(list)}>
                            ✓ Mark Completed
                          </button>
                          {!allEntered && <span style={{ fontSize:11, color:C.muted }}>Tip: enter ERP qty for each part first (optional)</span>}
                          <button style={{ ...BT("out"), fontSize:mob?13:12, marginLeft:"auto" }}
                            onClick={()=>expList(list)}>↓ Export</button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })()}

        {tab==="history"&&(
          <div>
            <div style={PT}><span style={RB}/>Count History</div>
            <div style={PS}>All submitted count sessions</div>
            <div style={{ background:"#0d1117",border:`1px solid ${C.bdr}`,borderRadius:4,padding:"9px 14px",marginBottom:14,fontSize:11,color:C.muted,display:"flex",gap:16,flexWrap:"wrap",alignItems:"center" }}>
              <span>Completed sessions: <strong style={{ color:C.wht }}>{history.length}</strong></span>
              <span>Awaiting review: <strong style={{ color:C.wht }}>{lists.filter(l=>l.submitted&&!l.completed).length}</strong></span>
              <button style={{ ...BT("out"),fontSize:10,padding:"4px 10px",marginLeft:"auto" }}
                onClick={()=>{
                  (async()=>{ const done=lists.filter(l=>l.completed); const miss=done.filter(l=>!history.find(h=>h.id===l.id)); if(!miss.length){showToast("Up to date");return;} for(const l of miss) await DB.insertHistory(l); showToast(`Synced ${miss.length}`); })();
                }}>↻ Re-sync</button>
            </div>
            {history.length===0?(<div style={CARD}><div style={{ color:C.muted }}>No sessions yet.</div></div>):history.map(list=>{
              const cnt=list.items.filter(i=>i.status==="counted").length;
              return (
                <div key={list.id} style={{ ...FLAT,marginBottom:14 }}>
                  <div style={{ display:"flex",alignItems:mob?"flex-start":"center",justifyContent:"space-between",marginBottom:14,gap:10,flexDirection:mob?"column":"row" }}>
                    <div>
                      <div style={{ fontSize:15,fontWeight:900,color:C.wht,marginBottom:3 }}>{list.name}</div>
                      <div style={{ fontSize:11,color:C.muted }}><strong style={{ color:C.lt }}>{list.assignedName}</strong> · {list.submittedAt}</div>
                    </div>
                    <div style={{ display:"flex",gap:8,alignItems:"center",flexWrap:"wrap" }}>
                      <span style={{ fontSize:11,color:C.ok,fontWeight:700 }}>{cnt}/{list.items.length} counted</span>
                      <button style={{ ...BT("out"),fontSize:mob?12:11,padding:mob?"8px 14px":"5px 12px" }} onClick={()=>expList(list)}>↓ Export</button>
                    </div>
                  </div>
                  <div style={{ overflowX:"auto",WebkitOverflowScrolling:"touch" }}>
                    <table style={{ width:"100%",borderCollapse:"collapse",fontSize:mob?11:12,minWidth:mob?460:"auto" }}>
                      <thead><tr>{["Part #","Loc","Counted","Status"].map(h=><th key={h} style={{ textAlign:"left",padding:"7px 9px",background:C.blk,color:C.muted,fontSize:9,fontWeight:900,letterSpacing:"0.08em",textTransform:"uppercase",borderBottom:`2px solid ${C.red}`,whiteSpace:"nowrap" }}>{h}</th>)}</tr></thead>
                      <tbody>
                        {list.items.map(i=>(
                          <tr key={i.id}>
                            <td style={{ padding:"7px 9px",borderBottom:`1px solid ${C.mid}`,fontWeight:900,color:C.wht }}>{i.partNum}</td>
                            <td style={{ padding:"7px 9px",borderBottom:`1px solid ${C.mid}`,color:C.warn }}>{i.location||"—"}</td>
                            <td style={{ padding:"7px 9px",borderBottom:`1px solid ${C.mid}`,textAlign:"right",fontWeight:900,color:C.wht }}>{i.countedQty||"—"}</td>
                            <td style={{ padding:"7px 9px",borderBottom:`1px solid ${C.mid}` }}>
                              <span style={{ width:7,height:7,borderRadius:"50%",display:"inline-block",marginRight:5,background:i.status==="counted"?C.ok:i.status==="skipped"?C.warn:C.bdr }}/>
                              <span style={{ fontSize:9,color:C.muted,textTransform:"uppercase",fontWeight:700 }}>{i.status}</span>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {tab==="report"&&(
          <div>
            <div style={PT}><span style={RB}/>Count Report</div>
            <div style={PS}>Worker count vs ERP system qty — matches and adjustments</div>
            {(()=>{ const rev=rFilt.filter(r=>r.systemQty!==null),match=rev.filter(r=>r.correct).length,ap=rev.length>0?Math.round((match/rev.length)*100):null,ac=ap===null?C.muted:ap>=95?C.ok:ap>=80?C.warn:C.err,pos=rFilt.filter(r=>r.variance>0).length,neg=rFilt.filter(r=>r.variance<0).length;
              return (
                <>
                  <div style={SG(5)}>
                    {[["Counted",rFilt.length,C.red],["% Match",ap!==null?`${ap}%`:"—",ac],["Adjustments",rFilt.filter(r=>r.variance!==0&&r.variance!==null).length,C.warn],["Surplus",pos,C.ok],["Shortage",neg,neg>0?C.err:C.muted]].map(([l,v,cl])=>(
                      <div key={l} style={SB(cl)}><div style={{ fontSize:mob?24:28,fontWeight:900,color:C.wht,lineHeight:1,marginBottom:3 }}>{v}</div><div style={{ fontSize:9,color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em",fontWeight:700 }}>{l}</div></div>
                    ))}
                  </div>
                  {rWkrs.length>0&&(
                    <div style={{ ...FLAT,marginBottom:14 }}>
                      <div style={{ fontSize:10,fontWeight:900,letterSpacing:"0.18em",color:C.red,textTransform:"uppercase",marginBottom:12 }}>Match Rate by Worker</div>
                      <div style={{ display:"grid",gridTemplateColumns:mob?"1fr":tabW?"1fr 1fr":"repeat(3,1fr)",gap:10 }}>
                        {rWkrs.map(name=>{ const wr=rFilt.filter(r=>r.workerName===name),wrev=wr.filter(r=>r.systemQty!==null),wc=wrev.filter(r=>r.correct).length,wp=wrev.length>0?Math.round((wc/wrev.length)*100):null,wc2=wp===null?C.muted:wp>=95?C.ok:wp>=80?C.warn:C.err; return (
                          <div key={name} style={{ background:C.blk,border:`1px solid ${C.bdr}`,borderRadius:4,padding:"12px 14px" }}>
                            <div style={{ display:"flex",alignItems:"center",gap:8,marginBottom:8 }}>
                              <Avtr name={name} sz={28}/>
                              <span style={{ fontWeight:700,color:C.lt,fontSize:13,flex:1,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>{name}</span>
                              <Badge label={wp!==null?`${wp}%`:"N/A"} color={wc2}/>
                            </div>
                            <div style={{ ...TRCK,height:5,marginBottom:4 }}><div style={FILL(wp??0,wc2)}/></div>
                            <div style={{ fontSize:10,color:C.muted }}>{wc}/{wrev.length} matched · {wr.length} total</div>
                          </div>
                        );})}
                      </div>
                    </div>
                  )}
                </>
              );
            })()}
            <div style={{ ...FLAT,marginBottom:14 }}>
              <div style={{ display:"grid",gridTemplateColumns:mob?"1fr":tabW?"1fr 1fr":"1fr 1fr auto",gap:12,alignItems:"flex-end" }}>
                <div><label style={LBL}>Filter by Worker</label>
                  <select style={INP(mob)} value={rptW} onChange={e=>setRptW(e.target.value)}>
                    <option value="all">All Workers</option>
                    {rWkrs.map(n=><option key={n} value={n}>{n}</option>)}
                  </select>
                </div>
                <div><label style={LBL}>Search Part #</label><input style={INP(mob)} placeholder="e.g. PN-1234" value={rptP} onChange={e=>setRptP(e.target.value)}/></div>
                <button style={{ ...BT("pri"),fontSize:mob?14:12,width:mob?"100%":"auto",marginTop:mob?4:0 }} onClick={expReport} disabled={!rFilt.length}>↓ Export</button>
              </div>
            </div>
            {rRows.length===0?(<div style={CARD}><div style={{ color:C.muted }}>No completed counts yet. Mark counts completed in the Submitted tab to see them here.</div></div>):rFilt.length===0?(<div style={FLAT}><div style={{ color:C.muted }}>No results.</div></div>):(
              <div style={{ ...FLAT,padding:0,overflow:"hidden" }}>
                <div style={{ overflowX:"auto",WebkitOverflowScrolling:"touch" }}>
                  <table style={{ width:"100%",borderCollapse:"collapse",fontSize:mob?12:13,minWidth:mob?620:"auto" }}>
                    <thead><tr>{[["partNum","Part #"],["location","Loc"],["countedQty","Worker Count"],["systemQty","ERP System"],["correct","Result"],["variance","Adjustment"],["workerName","Worker"],["countedAt","Date"]].map(([col,lbl])=><TH key={col} h={lbl} col={col}/>)}</tr></thead>
                    <tbody>
                      {rFilt.map((r,i)=>(
                        <tr key={i} style={{ background:i%2===0?"transparent":"rgba(255,255,255,0.018)" }}>
                          <td style={{ padding:"8px 9px",borderBottom:`1px solid ${C.mid}`,fontWeight:900,color:C.wht,whiteSpace:"nowrap" }}>{r.partNum}</td>
                          <td style={{ padding:"8px 9px",borderBottom:`1px solid ${C.mid}`,color:C.warn,fontWeight:700 }}>{r.location||"—"}</td>
                          <td style={{ padding:"8px 9px",borderBottom:`1px solid ${C.mid}`,textAlign:"right",fontWeight:900,color:C.wht,fontSize:14 }}>{r.countedQty}</td>
                          <td style={{ padding:"8px 9px",borderBottom:`1px solid ${C.mid}`,textAlign:"right",color:r.systemQty===null?C.muted:C.lt,fontWeight:700 }}>{r.systemQty!==null?r.systemQty:"—"}</td>
                          <td style={{ padding:"8px 9px",borderBottom:`1px solid ${C.mid}` }}><span style={{ fontSize:12,fontWeight:900,color:r.systemQty===null?C.muted:r.correct?C.ok:C.err }}>{r.systemQty===null?"Not reviewed":r.correct?"✓ Match":"✗ Adjust"}</span></td>
                          <td style={{ padding:"8px 9px",borderBottom:`1px solid ${C.mid}`,textAlign:"center" }}>{r.variance!==null&&r.variance!==0?<Pill adj={r.variance}/>:r.variance===0?<Badge label="0" color={C.ok}/>:<span style={{ color:C.muted }}>—</span>}</td>
                          <td style={{ padding:"8px 9px",borderBottom:`1px solid ${C.mid}` }}><div style={{ display:"flex",alignItems:"center",gap:6 }}><Avtr name={r.workerName} sz={22}/><span style={{ fontWeight:700,color:C.lt,fontSize:mob?11:12 }}>{r.workerName}</span></div></td>
                          <td style={{ padding:"8px 9px",borderBottom:`1px solid ${C.mid}`,color:C.muted,fontSize:10,whiteSpace:"nowrap" }}>{r.countedAt||"—"}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                <div style={{ background:C.blk,borderTop:`2px solid ${C.bdr}`,padding:"9px 14px",display:"flex",gap:20,flexWrap:"wrap",fontSize:11 }}>
                  <span style={{ fontWeight:900,color:C.muted,textTransform:"uppercase",letterSpacing:"0.07em" }}>Total: <span style={{ color:C.wht }}>{rFilt.length}</span></span>
                  {(()=>{ const rev=rFilt.filter(r=>r.systemQty!==null),c=rev.filter(r=>r.correct).length,p=rev.length>0?Math.round((c/rev.length)*100):null,cl=p===null?C.muted:p>=95?C.ok:p>=80?C.warn:C.err; return <span style={{ fontWeight:900,color:C.muted,textTransform:"uppercase",letterSpacing:"0.07em" }}>Match rate: <span style={{ color:cl }}>{p!==null?`${p}%`:"—"}</span> <span style={{ color:C.muted,fontWeight:400 }}>({c}/{rev.length})</span></span>; })()}
                </div>
              </div>
            )}
          </div>
        )}


      </main>
      <BotNav/>
      <Toast/>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
