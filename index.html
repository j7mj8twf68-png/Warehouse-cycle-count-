                  return (
                    <div key={list.id} style={{ ...FLAT,marginBottom:12 }}>
                      <div style={{ display:"flex",alignItems:"center",gap:14 }}>
                        <div style={{ position:"relative",flexShrink:0 }}>
                          <Ring pct={p} size={mob?50:60} sw={5}/>
                          <div style={{ position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:900,color:p===100?C.ok:C.red }}>{p}%</div>
                        </div>
                        <div style={{ flex:1,minWidth:0 }}>
                          <div style={{ display:"flex",alignItems:"center",gap:8,marginBottom:3,flexWrap:"wrap" }}>
                            <span style={{ fontSize:14,fontWeight:900,color:C.wht }}>{list.name}</span>
                            <Badge label="In Progress" color={C.warn}/>
                            {list.sourceFile&&<Badge label={list.sourceFile.replace(/\.[^.]+$/,"").slice(0,16)} color={C.muted}/>}
                          </div>
                          <div style={{ fontSize:11,color:C.muted,marginBottom:6 }}>→ <strong style={{ color:C.lt }}>{list.assignedName}</strong> · {list.items.length} parts · {list.createdAt}</div>
                          <div style={{ ...TRCK,marginBottom:4 }}><div style={FILL(p,p===100?C.ok:C.red)}/></div>
                          <div style={{ display:"flex",gap:12,fontSize:11 }}>
                            <span style={{ color:C.ok,fontWeight:700 }}>{c} counted</span>
                            <span style={{ color:C.warn,fontWeight:700 }}>{sk} skipped</span>
                            <span style={{ color:C.muted }}>{list.items.length-(c+sk)} left</span>
                          </div>
                        </div>
                        {!mob&&<button style={{ ...BT("out"),fontSize:11,padding:"5px 12px" }} onClick={()=>expList(list)}>↓ Export</button>}
                      </div>
                      {mob&&<button style={{ ...BT("out"),fontSize:12,width:"100%",marginTop:10 }} onClick={()=>expList(list)}>↓ Export</button>}
                    </div>
                  );
                })}
              </>
            )}
          </div>
        )}

        {tab==="workers"&&(
          <div>
            <div style={PT}><span style={RB}/>Workers</div>
            <div style={PS}>Manage accounts — name, PIN, and title</div>
            <div style={CARD}>
              <div style={{ display:"grid",gridTemplateColumns:mob?"1fr":"1fr 1fr 1fr",gap:12,marginBottom:14 }}>
                <div><label style={LBL}>Name</label><input style={INP(mob)} placeholder="Full name" value={nwName} onChange={e=>setNwName(e.target.value)}/></div>
                <div><label style={LBL}>PIN (4–6 digits)</label><input style={INP(mob)} placeholder="e.g. 4729" type="text" inputMode="numeric" maxLength={6} value={nwPin} onChange={e=>setNwPin(e.target.value.replace(/\D/g,""))}/></div>
                <div><label style={LBL}>Title</label>
                  <select style={INP(mob)} value={nwRole} onChange={e=>setNwRole(e.target.value)}>
                    <option value="worker">Supply Chain Specialist</option>
                    <option value="lead">Lead</option>
                    <option value="admin">Manager</option>
                  </select>
                </div>
              </div>
              <button style={{ ...BT("pri"),fontSize:mob?14:12 }} onClick={addWorker}>+ Add Person</button>
            </div>
            <div style={{ display:"grid",gap:10 }}>
              {workers.map(w=>{ const wL=lists.filter(l=>l.assignedTo===w.id&&!l.submitted).length; const editing=editId===w.id; return (
                <div key={w.id} style={{ ...FLAT,marginBottom:0 }}>
                  {editing?(
                    <div>
                      <div style={{ display:"grid",gridTemplateColumns:mob?"1fr":"1fr 1fr 1fr",gap:12,marginBottom:12 }}>
                        <div><label style={LBL}>Name</label><input style={INP(mob)} value={edName} onChange={e=>setEdName(e.target.value)}/></div>
                        <div><label style={LBL}>PIN</label><input style={INP(mob)} type="text" inputMode="numeric" maxLength={6} value={edPin} onChange={e=>setEdPin(e.target.value.replace(/\D/g,""))}/></div>
                        <div><label style={LBL}>Title</label>
                          <select style={{ ...INP(mob),opacity:w.id==="admin"?0.5:1 }} value={edRole} disabled={w.id==="admin"} onChange={e=>setEdRole(e.target.value)}>
                            <option value="worker">Supply Chain Specialist</option>
                            <option value="lead">Lead</option>
                            <option value="admin">Manager</option>
                          </select>
                        </div>
                      </div>
                      <div style={{ display:"flex",gap:10 }}>
                        <button style={{ ...BT("pri"),fontSize:mob?14:12 }} onClick={()=>saveEdit(w.id)}>Save</button>
                        <button style={{ ...BT("ghost"),fontSize:mob?14:12 }} onClick={cancelEdit}>Cancel</button>
                      </div>
                    </div>
                  ):(
                    <div style={{ display:"flex",alignItems:"center",gap:12 }}>
                      <Avtr name={w.name} bg={roleClr(w.role)===C.muted?C.mid:roleClr(w.role)} sz={mob?38:32}/>
                      <div style={{ flex:1,minWidth:0 }}>
                        <div style={{ fontSize:mob?16:14,fontWeight:900,color:C.wht }}>{w.name}</div>
                        <div style={{ display:"flex",gap:8,marginTop:3,alignItems:"center",flexWrap:"wrap" }}>
                          <Badge label={roleLbl(w.role)} color={roleClr(w.role)}/>
                          <span style={{ fontSize:11,color:C.muted }}>{"●".repeat(w.pin.length)} PIN</span>
                          {wL>0&&<Badge label={`${wL} active`} color={C.warn}/>}
                        </div>
                      </div>
                      <button style={{ ...BT("out"),fontSize:mob?12:10,padding:mob?"8px 14px":"3px 10px" }} onClick={()=>startEdit(w)}>Edit</button>
                      {w.id!=="admin"&&<button style={{ ...BT("ghost"),fontSize:mob?12:10,padding:mob?"8px 14px":"3px 10px",color:C.err }} onClick={()=>removeWorker(w.id)}>Remove</button>}
                    </div>
                  )}
                </div>
              );})}
            </div>
          </div>
        )}

        {tab==="review"&&(()=>{
          // Submitted lists that haven't been marked completed yet
          const pendingReview = lists.filter(l=>l.submitted && !l.completed);

          // Update a single item's system (ERP) qty within a submitted list
          const setSysQty = (listId, itemId, val) => {
            setLists(prev=>prev.map(l=>{
              if(l.id!==listId) return l;
              const items = l.items.map(it=>{
                if(it.id!==itemId) return it;
                const sys = val===""?null:Number(val);
                const cnt = Number(it.countedQty);
                return {...it, systemQty:val, variance: sys!==null&&!isNaN(cnt) ? cnt-sys : null};
              });
              DB.updateItems(listId, items);
              return {...l, items};
            }));
          };

          const markCompleted = async (list) => {
            if(!window.confirm(`Mark "${list.name}" as completed? It will move to History.`)) return;
            const completedAt = nowStr();
            const completedList = {...list, completed:true, completedAt, completedBy:user.name};
            try {
              await DB.markCompleted(list.id, completedList.items, completedAt, user.name);
              await DB.insertHistory(completedList);
              setLists(prev=>prev.map(l=>l.id===list.id?completedList:l));
              setHistory(prev=>[completedList, ...prev.filter(h=>h.id!==list.id)]);
              showToast(`✓ ${list.name} completed & moved to History`);
            } catch(e){ console.error(e); showToast("Failed to complete","err"); }
          };

          // Send a single part back to its original worker as a new "Recount" list
          const recountItem = async (list, item) => {
            if(!window.confirm(`Send ${item.partNum} back to ${list.assignedName} for a recount?`)) return;
            const dateLabel = new Date().toLocaleDateString("en-US",{month:"short",day:"numeric"});
            const newItem = {
              id:uid(), partNum:item.partNum, description:item.description, location:item.location,
              unitPrice:item.unitPrice, bookQty:item.bookQty, countedQty:"", adjustment:null, status:"pending", countedAt:null, note:"",
            };
            const recountList = {
              id:uid(), name:`${dateLabel} Recount`,
              assignedTo:list.assignedTo, assignedName:list.assignedName,
              createdAt:nowStr(), createdBy:user.name,
              sourceFile:list.sourceFile, sourceFileId:list.sourceFileId,
              items:[newItem],
            };
            try {
              // If a recount list for this worker + same date already exists & not submitted, append to it
              const existing = lists.find(l=>!l.submitted && l.name===recountList.name && l.assignedTo===list.assignedTo);
              if(existing){
                const merged = [...existing.items.filter(i=>i.partNum!==item.partNum), newItem];
                await DB.updateItems(existing.id, merged);
                setLists(prev=>prev.map(l=>l.id===existing.id?{...l,items:merged}:l));
              } else {
                await DB.insertList(recountList);
                setLists(prev=>[recountList, ...prev]);
              }
              showToast(`↻ ${item.partNum} sent to ${list.assignedName} for recount`);
            } catch(e){ console.error(e); showToast("Failed to send recount","err"); }
          };

          return (
            <div>
              <div style={PT}><span style={RB}/>Submitted Counts</div>
              <div style={PS}>Review counts, enter what the ERP system shows, then mark completed</div>
              <div style={{ background:C.navyGl,border:`1px solid ${C.bdr}`,borderLeft:`3px solid ${C.warn}`,borderRadius:8,padding:"9px 14px",marginBottom:16,fontSize:12,color:C.lt,display:"flex",alignItems:"center",gap:8 }}>
                <span style={{ fontSize:15 }}>⏰</span>
                <span>Any active count not submitted by <strong style={{ color:C.warn }}>4:00 PM</strong> is automatically submitted and tagged <strong style={{ color:C.lt }}>(Auto 4PM)</strong>.</span>
              </div>

              {pendingReview.length===0?(
                <div style={{ ...CARD,textAlign:"center",padding:"32px 20px" }}>
                  <div style={{ fontSize:40,marginBottom:12 }}>📭</div>
                  <div style={{ fontSize:16,fontWeight:700,color:C.wht,marginBottom:6 }}>No counts awaiting review</div>
                  <div style={{ fontSize:13,color:C.muted }}>When a worker submits a count list, it appears here for review.</div>
                </div>
              ):(
                <div style={{ display:"grid", gap:16 }}>
                  {pendingReview.map(list=>{
                    const counted = list.items.filter(i=>i.status==="counted");
                    const allEntered = counted.every(i=>i.systemQty!==undefined && i.systemQty!=="" && i.systemQty!==null);
                    const varianceCount = counted.filter(i=>i.variance!==null&&i.variance!==undefined&&i.variance!==0).length;
                    return (
                      <div key={list.id} style={{ ...FLAT, marginBottom:0 }}>
                        {/* List header */}
                        <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:14, flexWrap:"wrap" }}>
                          <Avtr name={list.assignedName} bg={C.red} sz={36}/>
                          <div style={{ flex:1, minWidth:0 }}>
                            <div style={{ fontSize:mob?16:18, fontWeight:900, color:C.wht }}>{list.name}</div>
                            <div style={{ fontSize:11, color:C.muted }}>
                              Submitted by <strong style={{ color:C.lt }}>{list.assignedName}</strong> · {list.submittedAt}
                            </div>
                          </div>
                          <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
                            <Badge label={`${counted.length} counted`} color={C.ok}/>
                            {varianceCount>0 && <Badge label={`${varianceCount} variance`} color={C.warn}/>}
                          </div>
                        </div>

                        {/* Parts table */}
                        <div style={{ overflowX:"auto", WebkitOverflowScrolling:"touch", marginBottom:14 }}>
                          <table style={{ width:"100%", borderCollapse:"collapse", fontSize:mob?13:15, minWidth:mob?520:"auto" }}>
                            <thead>
                              <tr>{["Part #","Location","Unit Price","Counted","System (ERP)","Variance","Recount"].map(h=>(
                                <th key={h} style={{ textAlign:"left",padding:"11px 11px",background:C.blk,color:C.muted,fontSize:11,fontWeight:900,letterSpacing:"0.1em",textTransform:"uppercase",borderBottom:`2px solid ${C.red}`,whiteSpace:"nowrap" }}>{h}</th>
                              ))}</tr>
                            </thead>
                            <tbody>
                              {counted.map(it=>{
                                const v = it.variance;
                                const vc = v===null||v===undefined?C.muted:v===0?C.ok:v>0?C.warn:C.err;
                                return (
                                  <tr key={it.id}>
                                    <td style={{ padding:"11px 11px",borderBottom:`1px solid ${C.mid}`,fontWeight:700,fontFamily:NUM,fontSize:14,color:C.wht,whiteSpace:"nowrap" }}>{it.partNum}</td>
                                    <td style={{ padding:"11px 11px",borderBottom:`1px solid ${C.mid}`,color:C.warn,fontFamily:NUM,fontSize:13 }}>{it.location||"—"}</td>
                                    <td style={{ padding:"11px 11px",borderBottom:`1px solid ${C.mid}`,textAlign:"right",color:C.lt,fontFamily:NUM,fontSize:14 }}>{fmtPrice(it.unitPrice)}</td>
                                    <td style={{ padding:"11px 11px",borderBottom:`1px solid ${C.mid}`,textAlign:"right",fontWeight:700,fontFamily:NUM,color:C.wht,fontSize:18 }}>{it.countedQty}</td>
                                    <td style={{ padding:"9px 11px",borderBottom:`1px solid ${C.mid}`,textAlign:"center" }}>
                                      <input type="number" inputMode="numeric" placeholder="—"
                                        value={it.systemQty??""}
                                        style={{ background:C.blk,border:`1.5px solid ${it.systemQty!==undefined&&it.systemQty!==""?vc:C.bdr}`,color:C.wht,borderRadius:6,padding:"8px 8px",fontSize:18,fontWeight:700,textAlign:"center",width:90,fontFamily:NUM }}
                                        onChange={e=>setSysQty(list.id, it.id, e.target.value)}/>
                                    </td>
                                    <td style={{ padding:"11px 11px",borderBottom:`1px solid ${C.mid}`,textAlign:"center" }}>
                                      {v===null||v===undefined
                                        ? <span style={{ color:C.muted }}>—</span>
                                        : v===0
                                          ? <Badge label="✓ Match" color={C.ok}/>
                                          : <span style={{ ...PILL(v) }}>{v>0?"+":""}{v}</span>}
                                    </td>
                                    <td style={{ padding:"9px 11px",borderBottom:`1px solid ${C.mid}`,textAlign:"center" }}>
                                      <button style={{ ...BT("ghost"), fontSize:11, padding:"5px 12px", color:C.warn, borderColor:C.warn, border:`1px solid ${C.warn}55`, borderRadius:4 }}
                                        onClick={()=>recountItem(list, it)}>↻ Recount</button>
                                    </td>
                                  </tr>
                                );
                              })}
                            </tbody>
                          </table>
                        </div>

                        {/* Action row */}
                        <div style={{ display:"flex", gap:10, alignItems:"center", flexWrap:"wrap" }}>
                          <button style={{ ...BT("pri"), fontSize:mob?14:13, opacity:allEntered?1:0.55 }}
                            onClick={()=>markCompleted(list)}>
                            ✓ Mark Completed
                          </button>
                          {!allEntered && <span style={{ fontSize:11, color:C.muted }}>Tip: enter ERP qty for each part first (optional)</span>}
                          <button style={{ ...BT("out"), fontSize:mob?13:12, marginLeft:"auto" }}
                            onClick={()=>expList(list)}>↓ Export</button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })()}

        {tab==="history"&&(
          <div>
            <div style={PT}><span style={RB}/>Count History</div>
            <div style={PS}>All submitted count sessions</div>
            <div style={{ background:C.blk,border:`1px solid ${C.bdr}`,borderRadius:8,padding:"9px 14px",marginBottom:14,fontSize:11,color:C.muted,display:"flex",gap:16,flexWrap:"wrap",alignItems:"center" }}>
              <span>Completed sessions: <strong style={{ color:C.wht }}>{history.length}</strong></span>
              <span>Awaiting review: <strong style={{ color:C.wht }}>{lists.filter(l=>l.submitted&&!l.completed).length}</strong></span>
              <button style={{ ...BT("out"),fontSize:10,padding:"4px 10px",marginLeft:"auto" }}
                onClick={()=>{
                  (async()=>{ const done=lists.filter(l=>l.completed); const miss=done.filter(l=>!history.find(h=>h.id===l.id)); if(!miss.length){showToast("Up to date");return;} for(const l of miss) await DB.insertHistory(l); showToast(`Synced ${miss.length}`); })();
                }}>↻ Re-sync</button>
            </div>
            {history.length===0?(<div style={CARD}><div style={{ color:C.muted }}>No sessions yet.</div></div>):history.map(list=>{
              const cnt=list.items.filter(i=>i.status==="counted").length;
              const sessionExt=list.items.reduce((s,i)=>s+extCost(i.unitPrice, i.variance),0);
              const hasAdj=list.items.some(i=>i.variance!==null&&i.variance!==undefined&&i.variance!==0);
              return (
                <div key={list.id} style={{ ...FLAT,marginBottom:14 }}>
                  <div style={{ display:"flex",alignItems:mob?"flex-start":"center",justifyContent:"space-between",marginBottom:14,gap:10,flexDirection:mob?"column":"row" }}>
                    <div>
                      <div style={{ fontSize:15,fontWeight:900,color:C.wht,marginBottom:3 }}>{list.name}</div>
                      <div style={{ fontSize:11,color:C.muted }}><strong style={{ color:C.lt }}>{list.assignedName}</strong> · {list.submittedAt}</div>
                    </div>
                    <div style={{ display:"flex",gap:8,alignItems:"center",flexWrap:"wrap" }}>
                      <span style={{ fontSize:11,color:C.ok,fontWeight:700 }}>{cnt}/{list.items.length} counted</span>
                      {hasAdj && <Badge label={`Adj ${fmtMoney(sessionExt)}`} color={sessionExt<0?C.err:C.ok}/>}
                      <button style={{ ...BT("out"),fontSize:mob?12:11,padding:mob?"8px 14px":"5px 12px" }} onClick={()=>expList(list)}>↓ Export</button>
                    </div>
                  </div>
                  <div style={{ overflowX:"auto",WebkitOverflowScrolling:"touch" }}>
                    <table style={{ width:"100%",borderCollapse:"collapse",fontSize:mob?13:14,minWidth:mob?540:"auto" }}>
                      <thead><tr>{["Part #","Loc","Unit Price","Counted","Adj","Ext Cost","Status"].map(h=><th key={h} style={{ textAlign:"left",padding:"10px 10px",background:C.blk,color:C.muted,fontSize:11,fontWeight:900,letterSpacing:"0.08em",textTransform:"uppercase",borderBottom:`2px solid ${C.red}`,whiteSpace:"nowrap" }}>{h}</th>)}</tr></thead>
                      <tbody>
                        {list.items.map(i=>{ const ec=extCost(i.unitPrice,i.variance); const hasV=i.variance!==null&&i.variance!==undefined; return (
                          <tr key={i.id}>
                            <td style={{ padding:"10px 10px",borderBottom:`1px solid ${C.mid}`,fontWeight:700,fontFamily:NUM,fontSize:14,color:C.wht }}>{i.partNum}</td>
                            <td style={{ padding:"10px 10px",borderBottom:`1px solid ${C.mid}`,color:C.warn,fontFamily:NUM,fontSize:13 }}>{i.location||"—"}</td>
                            <td style={{ padding:"10px 10px",borderBottom:`1px solid ${C.mid}`,textAlign:"right",color:C.lt,fontFamily:NUM,fontSize:14 }}>{fmtPrice(i.unitPrice)}</td>
                            <td style={{ padding:"10px 10px",borderBottom:`1px solid ${C.mid}`,textAlign:"right",fontWeight:700,fontFamily:NUM,fontSize:17,color:C.wht }}>{i.countedQty||"—"}</td>
                            <td style={{ padding:"10px 10px",borderBottom:`1px solid ${C.mid}`,textAlign:"center" }}>{hasV&&i.variance!==0?<Pill adj={i.variance}/>:hasV?<Badge label="0" color={C.ok}/>:<span style={{ color:C.muted }}>—</span>}</td>
                            <td style={{ padding:"10px 10px",borderBottom:`1px solid ${C.mid}`,textAlign:"right",fontWeight:700,fontFamily:NUM,fontSize:15,color:!hasV||i.variance===0?C.muted:ec<0?C.err:C.ok }}>{!hasV?"—":fmtMoney(ec)}</td>
                            <td style={{ padding:"10px 10px",borderBottom:`1px solid ${C.mid}` }}>
                              <span style={{ width:7,height:7,borderRadius:"50%",display:"inline-block",marginRight:5,background:i.status==="counted"?C.ok:i.status==="skipped"?C.warn:C.bdr }}/>
                              <span style={{ fontSize:9,color:C.muted,textTransform:"uppercase",fontWeight:700 }}>{i.status}</span>
                            </td>
                          </tr>
                        );})}
                      </tbody>
                    </table>
                  </div>
                  {hasAdj && (
                    <div style={{ background:C.blk,borderTop:`2px solid ${C.bdr}`,marginTop:10,padding:"9px 14px",display:"flex",justifyContent:"flex-end",gap:8,alignItems:"center" }}>
                      <span style={{ fontSize:12,fontWeight:900,color:C.muted,textTransform:"uppercase",letterSpacing:"0.08em" }}>Total Extended Cost of Adjustments:</span>
                      <span style={{ fontSize:22,fontWeight:700,fontFamily:NUM,color:sessionExt<0?C.err:sessionExt>0?C.ok:C.wht }}>{fmtMoney(sessionExt)}</span>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}

        {tab==="report"&&(
          <div>
            <div style={PT}><span style={RB}/>Count Report</div>
            <div style={PS}>Worker count vs ERP system qty — matches and adjustments</div>
            {(()=>{ const rev=rFilt.filter(r=>r.systemQty!==null),match=rev.filter(r=>r.correct).length,ap=rev.length>0?Math.round((match/rev.length)*100):null,ac=ap===null?C.muted:ap>=95?C.ok:ap>=80?C.warn:C.err,pos=rFilt.filter(r=>r.variance>0).length,neg=rFilt.filter(r=>r.variance<0).length,netExt=rFilt.reduce((s,r)=>s+(r.extCost||0),0),absExt=rFilt.reduce((s,r)=>s+Math.abs(r.extCost||0),0);
              return (
                <>
                  <div style={SG(3)}>
                    {[["Counted",rFilt.length,C.red],["% Match",ap!==null?`${ap}%`:"—",ac],["Adjustments",rFilt.filter(r=>r.variance!==0&&r.variance!==null).length,C.warn],["Surplus",pos,C.ok],["Shortage",neg,neg>0?C.err:C.muted],["Net $ Adjusted",fmtMoney(netExt),netExt<0?C.err:netExt>0?C.ok:C.muted]].map(([l,v,cl])=>(
                      <div key={l} style={SB(cl)}><div style={{ fontSize:mob?28:34,fontWeight:700,fontFamily:NUM,color:C.wht,lineHeight:1,marginBottom:5 }}>{v}</div><div style={{ fontSize:mob?11:12,color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em",fontWeight:700 }}>{l}</div></div>
                    ))}
                  </div>
                  <div style={{ ...FLAT,marginBottom:14,display:"flex",gap:28,flexWrap:"wrap",alignItems:"center" }}>
                    <div><div style={{ fontSize:mob?11:12,color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em",fontWeight:700,marginBottom:4 }}>Net Extended Cost Impact</div><div style={{ fontSize:mob?30:38,fontWeight:700,fontFamily:NUM,color:netExt<0?C.err:netExt>0?C.ok:C.wht,lineHeight:1 }}>{fmtMoney(netExt)}</div></div>
                    <div><div style={{ fontSize:mob?11:12,color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em",fontWeight:700,marginBottom:4 }}>Total $ Moved (abs)</div><div style={{ fontSize:mob?30:38,fontWeight:700,fontFamily:NUM,color:C.lt,lineHeight:1 }}>{fmtMoney(absExt)}</div></div>
                    <div style={{ fontSize:mob?12:13,color:C.muted,maxWidth:280,lineHeight:1.5 }}>Net = sum of (unit price × adjustment). Positive = surplus value found, negative = shortage.</div>
                  </div>
                  {rWkrs.length>0&&(
                    <div style={{ ...FLAT,marginBottom:14 }}>
                      <div style={{ fontSize:10,fontWeight:900,letterSpacing:"0.18em",color:C.red,textTransform:"uppercase",marginBottom:12 }}>Match Rate by Worker</div>
                      <div style={{ display:"grid",gridTemplateColumns:mob?"1fr":tabW?"1fr 1fr":"repeat(3,1fr)",gap:10 }}>
                        {rWkrs.map(name=>{ const wr=rFilt.filter(r=>r.workerName===name),wrev=wr.filter(r=>r.systemQty!==null),wc=wrev.filter(r=>r.correct).length,wp=wrev.length>0?Math.round((wc/wrev.length)*100):null,wc2=wp===null?C.muted:wp>=95?C.ok:wp>=80?C.warn:C.err; return (
                          <div key={name} style={{ background:C.blk,border:`1px solid ${C.bdr}`,borderRadius:4,padding:"12px 14px" }}>
                            <div style={{ display:"flex",alignItems:"center",gap:8,marginBottom:8 }}>
                              <Avtr name={name} sz={28}/>
                              <span style={{ fontWeight:700,color:C.lt,fontSize:13,flex:1,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>{name}</span>
                              <Badge label={wp!==null?`${wp}%`:"N/A"} color={wc2}/>
                            </div>
                            <div style={{ ...TRCK,height:5,marginBottom:4 }}><div style={FILL(wp??0,wc2)}/></div>
                            <div style={{ fontSize:10,color:C.muted }}>{wc}/{wrev.length} matched · {wr.length} total</div>
                          </div>
                        );})}
                      </div>
                    </div>
                  )}
                  {monthAgg.length>0&&(
                    <div style={{ ...FLAT,marginBottom:14 }}>
                      <div style={{ fontSize:mob?12:13,fontWeight:900,letterSpacing:"0.18em",color:C.red,textTransform:"uppercase",marginBottom:4 }}>Net Adjustment by Month</div>
                      <div style={{ fontSize:mob?12:13,color:C.muted,marginBottom:14 }}>Total extended cost of adjustments for all completed counts, grouped by month</div>
                      <div style={{ display:"grid",gridTemplateColumns:mob?"1fr 1fr":tabW?"repeat(3,1fr)":"repeat(4,1fr)",gap:12 }}>
                        {monthAgg.map(m=>(
                          <div key={m.key} style={{ background:C.blk,border:`1px solid ${C.bdr}`,borderTop:`4px solid ${m.net<0?C.err:m.net>0?C.ok:C.bdr}`,borderRadius:10,padding:mob?"14px 16px":"16px 18px" }}>
                            <div style={{ fontSize:mob?13:14,color:C.lt,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:700,marginBottom:8 }}>{m.label}</div>
                            <div style={{ fontSize:mob?28:32,fontWeight:700,fontFamily:NUM,color:m.net<0?C.err:m.net>0?C.ok:C.wht,lineHeight:1,marginBottom:8 }}>{fmtMoney(m.net)}</div>
                            <div style={{ fontSize:mob?12:12,color:C.muted }}>{m.count} count{m.count!==1?"s":""} · {fmtMoney(m.abs)} moved</div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </>
              );
            })()}
            <div style={{ ...FLAT,marginBottom:14 }}>
              <div style={{ display:"grid",gridTemplateColumns:mob?"1fr":tabW?"1fr 1fr":"1fr 1fr auto",gap:12,alignItems:"flex-end" }}>
                <div><label style={LBL}>Filter by Worker</label>
                  <select style={INP(mob)} value={rptW} onChange={e=>setRptW(e.target.value)}>
                    <option value="all">All Workers</option>
                    {rWkrs.map(n=><option key={n} value={n}>{n}</option>)}
                  </select>
                </div>
                <div><label style={LBL}>Search Part #</label><input style={INP(mob)} placeholder="e.g. PN-1234" value={rptP} onChange={e=>setRptP(e.target.value)}/></div>
                <button style={{ ...BT("pri"),fontSize:mob?14:12,width:mob?"100%":"auto",marginTop:mob?4:0 }} onClick={expReport} disabled={!rFilt.length}>↓ Export</button>
              </div>
            </div>
            {rRows.length===0?(<div style={CARD}><div style={{ color:C.muted }}>No completed counts yet. Mark counts completed in the Submitted tab to see them here.</div></div>):rFilt.length===0?(<div style={FLAT}><div style={{ color:C.muted }}>No results.</div></div>):(
              <div style={{ ...FLAT,padding:0,overflow:"hidden" }}>
                <div style={{ overflowX:"auto",WebkitOverflowScrolling:"touch" }}>
                  <table style={{ width:"100%",borderCollapse:"collapse",fontSize:mob?13:14,minWidth:mob?620:"auto" }}>
                    <thead><tr>{[["partNum","Part #"],["location","Loc"],["unitPrice","Unit Price"],["countedQty","Worker Count"],["systemQty","ERP System"],["correct","Result"],["variance","Adjustment"],["extCost","Ext Cost"],["workerName","Worker"],["countedAt","Date"]].map(([col,lbl])=><TH key={col} h={lbl} col={col}/>)}</tr></thead>
                    <tbody>
                      {rFilt.map((r,i)=>(
                        <tr key={i} style={{ background:i%2===0?"transparent":"rgba(255,255,255,0.018)" }}>
                          <td style={{ padding:"11px 11px",borderBottom:`1px solid ${C.mid}`,fontWeight:700,fontFamily:NUM,fontSize:14,color:C.wht,whiteSpace:"nowrap" }}>{r.partNum}</td>
                          <td style={{ padding:"11px 11px",borderBottom:`1px solid ${C.mid}`,color:C.warn,fontWeight:700,fontFamily:NUM,fontSize:13 }}>{r.location||"—"}</td>
                          <td style={{ padding:"11px 11px",borderBottom:`1px solid ${C.mid}`,textAlign:"right",color:C.lt,fontFamily:NUM,fontSize:14 }}>{fmtPrice(r.unitPrice)}</td>
                          <td style={{ padding:"11px 11px",borderBottom:`1px solid ${C.mid}`,textAlign:"right",fontWeight:700,fontFamily:NUM,color:C.wht,fontSize:17 }}>{r.countedQty}</td>
                          <td style={{ padding:"11px 11px",borderBottom:`1px solid ${C.mid}`,textAlign:"right",color:r.systemQty===null?C.muted:C.lt,fontWeight:700,fontFamily:NUM,fontSize:17 }}>{r.systemQty!==null?r.systemQty:"—"}</td>
                          <td style={{ padding:"11px 11px",borderBottom:`1px solid ${C.mid}` }}><span style={{ fontSize:15,fontWeight:900,color:r.systemQty===null?C.muted:r.correct?C.ok:C.err }}>{r.systemQty===null?"Not reviewed":r.correct?"✓ Match":"✗ Adjust"}</span></td>
                          <td style={{ padding:"11px 11px",borderBottom:`1px solid ${C.mid}`,textAlign:"center" }}>{r.variance!==null&&r.variance!==0?<Pill adj={r.variance}/>:r.variance===0?<Badge label="0" color={C.ok}/>:<span style={{ color:C.muted }}>—</span>}</td>
                          <td style={{ padding:"11px 11px",borderBottom:`1px solid ${C.mid}`,textAlign:"right",fontWeight:700,fontFamily:NUM,fontSize:15,color:r.variance===null||r.variance===0?C.muted:r.extCost<0?C.err:C.ok }}>{r.variance===null?"—":fmtMoney(r.extCost)}</td>
                          <td style={{ padding:"11px 11px",borderBottom:`1px solid ${C.mid}` }}><div style={{ display:"flex",alignItems:"center",gap:6 }}><Avtr name={r.workerName} sz={22}/><span style={{ fontWeight:700,color:C.lt,fontSize:mob?11:12 }}>{r.workerName}</span></div></td>
                          <td style={{ padding:"11px 11px",borderBottom:`1px solid ${C.mid}`,color:C.muted,fontSize:10,whiteSpace:"nowrap" }}>{r.countedAt||"—"}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                <div style={{ background:C.blk,borderTop:`2px solid ${C.bdr}`,padding:"12px 16px",display:"flex",gap:24,flexWrap:"wrap",fontSize:14 }}>
                  <span style={{ fontWeight:900,color:C.muted,textTransform:"uppercase",letterSpacing:"0.07em" }}>Total: <span style={{ color:C.wht }}>{rFilt.length}</span></span>
                  {(()=>{ const rev=rFilt.filter(r=>r.systemQty!==null),c=rev.filter(r=>r.correct).length,p=rev.length>0?Math.round((c/rev.length)*100):null,cl=p===null?C.muted:p>=95?C.ok:p>=80?C.warn:C.err; return <span style={{ fontWeight:900,color:C.muted,textTransform:"uppercase",letterSpacing:"0.07em" }}>Match rate: <span style={{ color:cl }}>{p!==null?`${p}%`:"—"}</span> <span style={{ color:C.muted,fontWeight:400 }}>({c}/{rev.length})</span></span>; })()}
                </div>
              </div>
            )}
          </div>
        )}


      </main>
      <BotNav/>
      <Toast/>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
